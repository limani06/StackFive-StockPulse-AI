<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock updates &mdash; StackFive AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar" id="topbar">
  <div class="brand">StackFive AI</div>
  <div style="display:flex; align-items:center; gap:14px;">
    <span class="who"></span>
    <button data-logout>Log out</button>
  </div>
</div>

<div class="chat-wrap">
  <div class="chat-log" id="chatLog">
    <div class="msg system">
      Tell me what came in or went out &mdash; just type it normally, like
      <em>&ldquo;Received 10 Rice 10kg&rdquo;</em>.
    </div>
  </div>
  <!-- MIC BUTTON ADDED HERE -->
  <form class="chat-input" id="chatForm">
    <input id="chatText" type="text" placeholder="e.g. Received 10 Rice 10kg" autocomplete="off" required>
    <button type="button" id="micBtn" style="background: transparent; border: 1px solid var(--green); color: var(--green); padding: 0 15px; border-radius: 20px; cursor: pointer;">🎤</button>
    <button type="submit">Send</button>
  </form>
</div>

<script src="app.js"></script>
<script>
  if (Auth.requireLogin(['STAFF', 'OWNER', 'ADMIN'])) {
    initTopbar(document.getElementById('topbar'));
    initVoiceInput('chatText', 'micBtn'); // INITIALIZE VOICE INPUT
  }

  const log = document.getElementById('chatLog');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('chatText');

  function addMsg(html, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.innerHTML = html;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addMsg(escapeHtml(text), 'me');
    input.value = '';

    try {
      const result = await api('/api/stock/submit', {
        method: 'POST',
        body: JSON.stringify({ rawInput: text, submittedByEmail: Auth.name() })
      });

      if (result.status === 'MATCHED') {
        addMsg(
          `Got it \u2014 <strong>${result.matchedProductName}</strong> updated by ${result.parsedQuantity}.` +
          `<div class="hint"><span class="stamp matched">MATCHED</span></div>`,
          'system'
        );
      } else {
        addMsg(
          `I couldn't match that to a product confidently.` +
          `<div class="hint"><span class="stamp unmatched">UNMATCHED</span> \u2014 an owner or staff member can fix this from the dashboard.</div>`,
          'system'
        );
      }
    } catch (err) {
      addMsg('Couldn\u2019t send that: ' + escapeHtml(err.message), 'system');
    }
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
