<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order &mdash; StackFive AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar" id="topbar">
  <div class="brand">StackFive AI</div>
  <div style="display:flex; align-items:center; gap:14px;">
    <span class="who"></span>
    <button data-logout>Log out</button>
  </div>
</div>

<div class="chat-wrap">
  <div class="chat-log" id="chatLog">
    <div class="msg system">
      What would you like to order? Just type it as you normally would, like
      <em>&ldquo;5 Rice 10kg&rdquo;</em>.
    </div>
  </div>
  <!-- MIC BUTTON ADDED HERE -->
  <form class="chat-input" id="chatForm">
    <input id="chatText" type="text" placeholder="e.g. 5 Rice 10kg" autocomplete="off" required>
    <button type="button" id="micBtn" style="background: transparent; border: 1px solid var(--green); color: var(--green); padding: 0 15px; border-radius: 20px; cursor: pointer;">🎤</button>
    <button type="submit">Send</button>
  </form>
</div>

<script src="app.js"></script>
<script>
  if (Auth.requireLogin(['CUSTOMER', 'OWNER', 'ADMIN'])) {
    initTopbar(document.getElementById('topbar'));
    initVoiceInput('chatText', 'micBtn'); // INITIALIZE VOICE INPUT
  }

  const log = document.getElementById('chatLog');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('chatText');

  function addMsg(html, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.innerHTML = html;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addMsg(escapeHtml(text), 'me');
    input.value = '';

    try {
      const result = await api('/api/orders/submit', {
        method: 'POST',
        body: JSON.stringify({ rawInput: text, customerEmail: Auth.name() })
      });

      if (result.status === 'CONFIRMED') {
        addMsg(
          `Order confirmed \u2014 ${result.quantity} \u00d7 <strong>${result.product.name}</strong> reserved for you.` +
          `<div class="hint"><span class="stamp confirmed">CONFIRMED</span></div>`,
          'system'
        );
      } else if (result.status === 'OUT_OF_STOCK') {
        addMsg(
          `Sorry \u2014 we don\u2019t have enough of that in stock right now.` +
          `<div class="hint"><span class="stamp out_of_stock">OUT OF STOCK</span></div>`,
          'system'
        );
      } else {
        addMsg(
          `Thanks \u2014 I\u2019ve passed this to the team to confirm, since I couldn\u2019t match it automatically.` +
          `<div class="hint"><span class="stamp pending_review">PENDING REVIEW</span></div>`,
          'system'
        );
      }
    } catch (err) {
      addMsg('Couldn\u2019t send that: ' + escapeHtml(err.message), 'system');
    }
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
